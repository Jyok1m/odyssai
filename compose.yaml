# Services d'infrastructure pour le developpement local.
# Postgres et Keycloak ne sont pas ici : Keycloak est heberge sur
# sso.joachimjasmin.com et sert aussi bien le realm dev que le realm prod.

services:
  redis:
    image: redis:8-alpine
    container_name: odyssai-redis
    restart: unless-stopped
    # Le mot de passe passe par un fichier plutot que par la ligne de commande :
    # il resterait visible dans docker inspect et dans la table des processus.
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    configs:
      - source: redis-conf
        target: /usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
    # Jamais expose au dela de la machine.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

configs:
  redis-conf:
    content: |
      requirepass ${REDIS_PASSWORD:?}
      appendonly yes
      appendfsync everysec
      # Les sessions ont toutes un TTL : sous pression memoire, on evince
      # ce qui expire le plus tot plutot que de refuser les ecritures.
      maxmemory 256mb
      maxmemory-policy volatile-ttl

volumes:
  redis-data:
